name: Refresh releases and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: catalog-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install site check dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Refresh public release links
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_catalog.py --verify-remote
      - name: Check catalog and site
        run: python scripts/check_site.py
      - name: Save verified catalog changes
        run: |
          if ! git diff --quiet -- data/catalog.json data/catalog.js; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/catalog.json data/catalog.js
            git commit -m 'Refresh public patch release links'
            git push origin HEAD:main
          fi
      - name: Stage public site
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -R assets data _site/
          python scripts/generate_game_pages.py --out _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
